name: tests

on:
  push:
  pull_request:

jobs:
  host-tests:
    name: Host test suite (mock hardware)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build + run all 5 configurations
        run: ./test/run_tests.sh --full
      - name: Coverage (gcov, ngưỡng 80%)
        run: ./test/run_tests.sh --coverage
